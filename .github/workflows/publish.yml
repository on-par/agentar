name: Publish to npm

# Publishes the `agentar` package when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
# Setup and the one-time bootstrap publish are described in docs/RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow via OIDC and attach provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:build
      - run: npm publish ./release/agentar --access public
